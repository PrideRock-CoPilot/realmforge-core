[workspace]
resolver = "2"
members = [
  "crates/rf-api",
  "crates/rf-cli",
  "crates/rf-domain",
  "crates/rf-events",
  "crates/rf-mcp",
  "crates/rf-policy",
  "crates/rf-snapshot",
  "crates/rf-store",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
rust-version = "1.78"
authors = ["RealmForge"]

[workspace.dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "uuid"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

rf-api = { path = "crates/rf-api" }
rf-domain = { path = "crates/rf-domain" }
rf-events = { path = "crates/rf-events" }
rf-mcp = { path = "crates/rf-mcp" }
rf-policy = { path = "crates/rf-policy" }
rf-snapshot = { path = "crates/rf-snapshot" }
rf-store = { path = "crates/rf-store" }
