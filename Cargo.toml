[workspace]
resolver = "2"
members = [
  "crates/agent-gateway",
  "crates/control-api",
  "crates/operator-cli",
  "crates/authority-domain",
  "crates/audit-log",
  "crates/agent-mcp",
  "crates/policy-engine",
  "crates/control-service",
  "crates/snapshot-ledger",
  "crates/control-store",
  "crates/runtime-bundle",
  "crates/live-runtime",
  "crates/live-watch",
  "crates/parquet-store",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
rust-version = "1.78"
authors = ["RealmForge"]

[workspace.dependencies]
axum = "0.7"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

agent-gateway = { path = "crates/agent-gateway" }
control-api = { path = "crates/control-api" }
operator-cli = { path = "crates/operator-cli" }
authority-domain = { path = "crates/authority-domain" }
audit-log = { path = "crates/audit-log" }
agent-mcp = { path = "crates/agent-mcp" }
policy-engine = { path = "crates/policy-engine" }
control-service = { path = "crates/control-service" }
snapshot-ledger = { path = "crates/snapshot-ledger" }
control-store = { path = "crates/control-store" }
parquet-store = { path = "crates/parquet-store" }
assert_cmd = "2"
predicates = "3"
tower = { version = "0.5", features = ["util"] }
