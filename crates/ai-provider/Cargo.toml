[package]
name = "ai-provider"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"

# HTTP client for API calls
reqwest = { version = "0.11", features = ["json"] }
